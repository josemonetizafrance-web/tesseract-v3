<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TESSERACT - Admin Panel</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <img id="cursor-tesseract" src="/dist/assets/logo.png" alt="">
    <div class="admin-container">
        <header class="admin-header">
            <div class="header-info">
                <img src="/dist/assets/tesseract-logo.svg" alt="TESSERACT" style="width:160px;height:auto;display:block;">
                <p class="admin-email" id="admin-email">admin@tesseract.com</p>
            </div>
            <button id="btn-refresh" class="btn-primary" style="flex:none;">REFRESH</button>
            <button id="btn-logout" class="btn-secondary" style="flex:none;">LOGOUT</button>
        </header>

        <!-- Tab Navigation -->
        <div class="tab-nav">
            <button class="tab-btn active" data-tab="users">👥 USUARIOS</button>
            <button class="tab-btn" data-tab="offices">🏢 OFICINAS</button>
            <button class="tab-btn" data-tab="admin">⚙️ ADMIN</button>
        </div>

        <main class="admin-main">

            <!-- ═══ TAB: USUARIOS ═══ -->
            <div id="tabUsers" class="tab-content active">
                <section class="panel" id="create-user-section">
                    <h2 class="panel-title">CREAR NUEVO USUARIO</h2>
                    <div class="panel-controls">
                        <input type="email" id="new-user-email" placeholder="usuario@tesseract.com" class="input-field">
                        <input type="text" id="new-user-password" placeholder="Contraseña*+" class="input-field" style="min-width:160px;">
                        <select id="new-user-type" class="input-field" style="min-width:140px;flex:none;">
                            <option value="operador">Operador</option>
                            <option value="admin">Admin de Oficina</option>
                        </select>
                        <input type="text" id="new-user-office" placeholder="Oficina" class="input-field" style="min-width:140px;flex:none;">
                        <button id="btn-create-user" class="btn-primary">CREAR</button>
                    </div>
                </section>

                <section class="panel" id="user-management-section">
                    <h2 class="panel-title">GESTIÓN DE USUARIOS</h2>
                    <div id="admin-actions-panel" class="panel-controls">
                        <input type="email" id="input-email" placeholder="usuario@tesseract.com" class="input-field" style="min-width:200px;">
                        <button id="btn-activate-premium" class="btn-primary">PREMIUM 30D</button>
                        <button id="btn-ban-user" class="btn-danger">BANEAR</button>
                        <button id="btn-unban-user" class="btn-secondary">DESBANEAR</button>
                        <input type="password" id="new-password-input" placeholder="Nueva pass*+" class="input-field" style="min-width:140px;flex:none;">
                        <button id="btn-change-password" class="btn-primary" style="background:#f59e0b;">CAMBIAR PASS</button>
                    </div>
                    <div class="user-list">
                        <table>
                            <thead>
                                <tr>
                                    <th>OFICINA</th>
                                    <th>EMAIL</th>
                                    <th>ESTADO</th>
                                    <th>LOGINS</th>
                                    <th>ACCIÓN</th>
                                    <th>PLAN</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="user-table-body"></tbody>
                        </table>
                    </div>
                </section>
            </div>

            <!-- ═══ TAB: OFICINAS ═══ -->
            <div id="tabOffices" class="tab-content">
                <section class="panel">
                    <h2 class="panel-title">OFICINAS REGISTRADAS</h2>
                    <div id="offices-list" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;padding:4px 0;"></div>
                </section>
                <section class="panel">
                    <h2 class="panel-title">CREAR OFICINA</h2>
                    <div class="panel-controls">
                        <input type="text" id="new-office-name" placeholder="Nombre de oficina" class="input-field">
                        <button id="btn-create-office" class="btn-primary">CREAR OFICINA</button>
                    </div>
                </section>
            </div>

            <!-- ═══ TAB: ADMIN ═══ -->
            <div id="tabAdmin" class="tab-content">
                <section class="panel">
                    <h2 class="panel-title">GESTIÓN DE DESARROLLADORES</h2>
                    <p style="font-size:12px;color:#888;margin-bottom:12px;">Solo el administrador maestro puede agregar desarrolladores.</p>
                    <div class="panel-controls">
                        <input type="email" id="input-dev-email" placeholder="nuevo@tesseract.com" class="input-field">
                        <button id="btn-add-dev" class="btn-primary">AGREGAR DESARROLLADOR</button>
                    </div>
                    <div id="dev-list" style="margin-top:16px;border-top:1px solid #f0f0f5;padding-top:16px;">
                        <div style="font-size:12px;font-weight:600;color:#555;margin-bottom:8px;">DESARROLLADORES ACTUALES:</div>
                        <div id="dev-list-items" style="display:flex;flex-direction:column;gap:6px;"></div>
                    </div>
                </section>
            </div>

        </main>
    </div>

    <script src="/dist/modules/error-handler.js"></script>
    <script src="admin.js"></script>
</body>
</html>
